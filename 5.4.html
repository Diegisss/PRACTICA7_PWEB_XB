<!DOCTYPE html>
<html lang="en">

<head>

    <title>5.4 Operadores</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>
    <script type="text/javascript">
        var num1 = 1;
        var num2 = 1.5;
        var suma = num1 + num2;
        document.write(num1 + " + " + num2 + " = " + suma);

        var cadena1 = "una cadena";
        var cadena2 = " mas larga";
        var cadena = cadena1 + cadena2;
        var cadena_igual = cadena;
        document.write("<br>" + cadena1 + " " + cadena_igual);
        document.write("La cadena corta tiene " + cadena1.length + " caracteres");

        document.write("<br>" + "La cadena mas larga tiene " + cadena.length + " caracteres");

        var pi = '3.1416';
        var numeroA = 10;
        var numeroB = 15;
        var numeroC = '15';
        suma1 = pi + numeroA;
        document.write("<br>" + suma1);
        suma2 = numeroA + numeroB;
        document.write("<br>" + suma2);

        document.write("<br>" + "pi == numeroA: " + (pi == numeroA) + " | " + "pi === numeroA: " + (pi === numeroA));
        document.write("<br>" + "pi == numeroC: " + (pi == numeroC) + " | " + "pi === numeroC: " + (pi === numeroC));
        document.write("<br>" + "numeroB == numeroC: " + (numeroB == numeroC) + " | " + "numeroB === numeroC: " + (numeroB === numeroC));
        document.write("<br>" + "numeroA > numeroB: " + (pi == numeroC) + " | " + "pi === numeroC: " + (pi === numeroC));
        document.write((numeroA > numeroB) ? "<br> numeroA es mayor a numeroB" :
            (numeroA === numeroB) ? "<br> numeroA es igual a numeroB" : "<br> numeroA es menor a numeroB")

    </script>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>
